name: Component versioning

# The video libraries' repositories (videocodec-library, rpivid-codec) call this from
# their own Versioning workflow: every PR must bump the version and update
# RELEASE-NOTES.md, build inside Kinora with the PR's sources in place of the
# submodule's, and pass its code gates there; a merge to main tags v<version>.  The
# PR is checked out two levels down (_pr/component), as the submodules are
# (external/<name>): its tests/run.sh finds Kinora's build three levels up.

on:
  workflow_call:
    inputs:
      source_dir_var:
        description: "Kinora's source-dir override for this component (KINORA_VIDEOCODEC_SOURCE_DIR, KINORA_RPIVID_SOURCE_DIR)"
        required: true
        type: string
      gates:
        description: "The component's code gates, run in its checkout after the build (e.g. 'tests/run.sh gates')"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  pr-gate:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kinora (superbuild + pinned submodules)
        uses: actions/checkout@v7
        with:
          repository: rondoval/kinora
          ref: main
          submodules: recursive

      - name: Checkout this component's PR
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          path: _pr/component

      - name: Version bumped and release notes updated
        working-directory: _pr/component
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          base="origin/${{ github.base_ref }}"
          extract() { grep -m1 -iE 'project[ \t]*\(.*VERSION' | sed -nE 's/.*VERSION[ \t]+([0-9]+(\.[0-9]+)*).*/\1/p'; }
          new_ver=$(extract < CMakeLists.txt)
          old_ver=$(git show "$base:CMakeLists.txt" | extract || true)
          echo "version: ${old_ver:-<none>} -> ${new_ver:-<none>}"
          [ -n "$new_ver" ] || { echo "::error::no project(... VERSION ...) found in CMakeLists.txt"; exit 1; }
          [ "$new_ver" != "$old_ver" ] || { echo "::error::project VERSION not bumped (still $new_ver)"; exit 1; }
          if git diff --quiet "$base"...HEAD -- RELEASE-NOTES.md; then
            echo "::error::RELEASE-NOTES.md was not updated in this PR"; exit 1
          fi

      - name: Build the component inside Kinora
        run: env "${{ inputs.source_dir_var }}=_pr/component" ./scripts/docker-build.sh

      - name: The component's code gates
        if: ${{ inputs.gates != '' }}
        working-directory: _pr/component
        run: ${{ inputs.gates }}

  tag:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create v<version> tag if it does not exist
        run: |
          set -euo pipefail
          ver=$(grep -m1 -iE 'project[ \t]*\(.*VERSION' CMakeLists.txt \
            | sed -nE 's/.*VERSION[ \t]+([0-9]+(\.[0-9]+)*).*/\1/p')
          [ -n "$ver" ] || { echo "::error::no project(... VERSION ...) found in CMakeLists.txt"; exit 1; }
          tag="v$ver"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "tag $tag already exists — nothing to do"
          else
            git tag "$tag"
            git push origin "$tag"
            echo "created and pushed $tag"
          fi
